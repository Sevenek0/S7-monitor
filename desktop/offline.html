<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
  <title>S7 Monitor — brak połączenia</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1013; color: #f4f4f2; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; padding: 24px; text-align: center; }
    .box { width: min(460px, 100%); background: #17181c; border: 1px solid #2c2e35; border-radius: 20px; padding: 28px 24px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #b9bab3; font-size: 14px; overflow-wrap: anywhere; }
    .row { display: flex; gap: 10px; margin-top: 18px; }
    button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid #2c2e35; background: #1f2126; color: #f4f4f2; font-weight: 600; cursor: pointer; }
    button.primary { background: #3987e5; border-color: #3987e5; color: #fff; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Brak połączenia z serwerem</h1>
    <p id="msg"></p>
    <div class="row"><button id="change">Zmień serwer</button><button class="primary" id="retry">Spróbuj ponownie</button></div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('msg').textContent = `${q.get('url') || ''} — ${q.get('err') || 'błąd sieci'}. Ponowna próba za 15 s.`;
    document.getElementById('retry').onclick = () => window.desktop.retry();
    document.getElementById('change').onclick = () => window.desktop.changeServer();
    setTimeout(() => window.desktop.retry(), 15000);
  </script>
</body>
</html>
