<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
  <title>S7 Monitor — konfiguracja</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1013; color: #f4f4f2; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; padding: 24px; }
    form { width: min(460px, 100%); background: #17181c; border: 1px solid #2c2e35; border-radius: 20px; padding: 28px 24px; }
    img { width: 64px; height: 64px; display: block; margin: 0 auto 14px; border-radius: 16px; }
    h1 { text-align: center; margin: 0 0 6px; font-size: 22px; }
    p { color: #b9bab3; margin: 0 0 18px; text-align: center; font-size: 14px; }
    label { display: block; font-weight: 600; font-size: 13px; color: #b9bab3; margin-bottom: 6px; }
    input { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 10px; border: 1px solid #2c2e35; background: #0f1013; color: #f4f4f2; font-size: 16px; }
    input:focus { outline: 2px solid #3987e5; border-color: transparent; }
    .hint { font-size: 12px; color: #85867f; margin: 6px 0 18px; }
    button { width: 100%; min-height: 46px; border: 0; border-radius: 10px; background: #3987e5; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: progress; }
    .err { color: #ff7a7a; min-height: 1.4em; margin: 10px 0 0; font-size: 14px; }
  </style>
</head>
<body>
  <form id="f">
    <img src="assets/icon.png" alt="">
    <h1>S7 Monitor</h1>
    <p>Podaj adres swojego serwera S7 Monitor (ten sam, który otwierasz w przeglądarce).</p>
    <label for="url">Adres serwera</label>
    <input id="url" type="url" placeholder="https://monitor.twojadomena.pl" autocomplete="url" required autofocus>
    <div class="hint">Adres zapisze się na tym komputerze. Zmienisz go później w menu ikony w zasobniku.</div>
    <button type="submit">Połącz</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <script>
    const f = document.getElementById('f');
    const input = document.getElementById('url');
    const err = document.getElementById('err');
    window.desktop.getServer().then((u) => { if (u) input.value = u; });
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = f.querySelector('button');
      btn.disabled = true; btn.textContent = 'Sprawdzanie…'; err.textContent = '';
      const r = await window.desktop.saveServer(input.value);
      if (!r.ok) { err.textContent = r.error; btn.disabled = false; btn.textContent = 'Połącz'; }
    });
  </script>
</body>
</html>
