# Wariant B: nginx (np. ten od Pterodactyla) jako reverse proxy dla S7 Monitor.
#
# 1) Skopiuj:   sudo cp deploy/nginx-s7monitor.conf /etc/nginx/sites-available/s7monitor.conf
# 2) Zamień "monitor.example.pl" na swoją domenę (lub np. 51-75-12-34.sslip.io).
# 3) Włącz:     sudo ln -s /etc/nginx/sites-available/s7monitor.conf /etc/nginx/sites-enabled/
#               sudo nginx -t && sudo systemctl reload nginx
# 4) HTTPS:     sudo certbot --nginx -d monitor.example.pl
#    certbot sam dopisze blok "listen 443 ssl" z certyfikatem i przekierowanie z HTTP.

map $http_upgrade $s7_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name monitor.example.pl;

    client_max_body_size 1m;

    # Strumień na żywo (SSE) — wyłączone buforowanie, długi timeout
    location /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $s7_connection_upgrade;
    }
}
